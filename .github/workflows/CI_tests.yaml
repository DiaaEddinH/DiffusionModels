name: CI Tests

on:
  push:
    branches: ["ci_tests"]
  pull_request:
    branches: ["version2"]

permissions:
  contents: read

jobs:
  tests:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up micromamba and create env from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          # Must match the "name:" field in your environment.yml
          activate-environment: score_env
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Show environment details
        shell: bash -l {0}
        run: |
          which python
          python --version
          python - <<'PY'
import importlib.util
for m in ("pytest", "torch"):
    spec = importlib.util.find_spec(m)
    print(f"{m}: {'found' if spec else 'missing'}")
PY

      - name: Install project (editable) if present
        shell: bash -l {0}
        run: |
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            pip install -e .
          fi

      - name: Run pytest
        shell: bash -l {0}
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests
