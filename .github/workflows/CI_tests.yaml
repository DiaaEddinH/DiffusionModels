name: CI Tests

on:
  push:
    branches: ["ci_tests"]
  pull_request:
    branches: ["version2"]

permissions:
  contents: read

jobs:
  tests:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up micromamba and create env from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          activate-environment: score_env   # must match name: in environment.yml
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Show environment details
        shell: bash -l {0}
        run: |
          which python
          python --version
          python -c "import importlib.util as u, sys; mods=('pytest','torch'); print(' '.join(f\"{m}:\"+('found' if u.find_spec(m) else 'missing') for m in mods)); print('Exec:', sys.executable)"

      - name: Install project (editable) if present
        shell: bash -l {0}
        run: |
          if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
            pip install -e .
          fi

      - name: Run pytest
        shell: bash -l {0}
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests
