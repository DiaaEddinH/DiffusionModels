name: sphinx-docs

on:
    # Runs on pushes targeting the default branch
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    
    # Allows to run this workflow manually from Actions tab
    workflow_dispatch:

# Sets permission of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs to allow these production deployments to complete.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # Setup runner for pages
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Pages
              if: ${{ !env.ACT }}
              uses: actions/configure-pages@v5
            
            - name: Set up micromamba
              uses: mamba-org/setup-micromamba@v2
              with:
                environment-file: environment.yml
                activate-environment: score_env
                cache-environment: true
                cache-downloads: true
                init-shell: bash

            - name: Install doc dependencies
              shell: bash -l {0}
              run: |
                pip install sphinx sphinx_rtd_theme myst_parser

            - name: Install project (editable) if present
              shell: bash -l {0}
              run: |
                if [ -f pyproject.toml ] || [ -f setup.cfg ] || [ -f setup.py ]; then
                    pip install -e .
                fi
            
            # Build Sphinx
            - name: Sphinx build
              shell: bash -l {0}
              run: |
                sphinx-build -b html docs/source docs/build/html

            # Upload docs
            - name: Upload pages artifact
              if: ${{ !env.ACT }}
              uses: actions/upload-pages-artifact@v4
              with:
                path: docs/build/html
    
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              if: ${{ !env.ACT }}
              id: deployment
              uses: actions/deploy-pages@v4


            
