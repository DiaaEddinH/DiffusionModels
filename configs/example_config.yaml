# network / schedule: resolved by aliases via the registries in config.py
network:
    name: linear
    params:
        in_channels: 2
        channels: [4, 4]
        time_channels: 24
        dropout_rate: 0.0

schedule:
    name: geometric
    params:
        sigma_min: 1.0
        sigma_max: 10.0

model:
    decay_rate: 0.999
    device: cpu

optimizer:
    name: adam
    params:
        lr: 2.0e-3

lr_scheduler:
    name: cosine
    params:
        T_max: 200

trainer:
    file_path: run001
    use_ddp: false
    checkpoint_dir: ./data/checkpoints
    weight_dir: ./data/weights
    log_dir: "logs/runs"
    metadata_csv_path: "./data/run_metadata.csv"
    save_weight_history: true
    weight_history_frequency: 10


run:
    N_epochs: 20
    early_stopping: 10
    min_delta: 1.0e-4
    batch_size: 10

extra:
    param0: ~
